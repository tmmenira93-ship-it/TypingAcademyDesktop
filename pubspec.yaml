name: typing_academy_desktop
description: Offline desktop typing tutor for Windows, macOS, and Linux.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  audioplayers: ^6.1.0
  path: ^1.9.0
  sqflite_common: ^2.5.4
  sqflite_common_ffi: ^2.3.3
  # Bundles the SQLite native library with the app (sqlite3.dll is not installed on Windows).
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lessons/
